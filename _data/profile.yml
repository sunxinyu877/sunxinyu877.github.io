short_bio_text_justify: false
short_bio: >-
  <p>
    I am a third-year Ph.D. student in the School of Computer Science
    and Technology at Beijing Jiaotong University, advised by
    <a href="https://faculty.bjtu.edu.cn/7968/" target="_blank">Prof. Congyan Lang</a>.
    My master's and doctoral research has been conducted at the
    Key Laboratory of Transportation Big Data and Artificial
    Intelligence, Ministry of Education.
    I received my bachelor's from BJTU in 2022.
  </p>
  <p>
    I am currently a visiting Ph.D. student in the
    <a href="https://sites.google.com/view/xml-nus" target="_blank">xML Lab</a>,
    <a href="https://cde.nus.edu.sg/" target="_blank">College of Design and Engineering</a>,
    National University of Singapore, hosted by
    <a href="https://sites.google.com/site/sitexinchaowang/" target="_blank">Assoc. Prof. Xinchao Wang</a>
    and supported by the China Scholarship Council (CSC).
    My research experience also includes joint training at the
    State Key Laboratory of Pattern Recognition, Institute of
    Automation, Chinese Academy of Sciences, during 2023–2026.
  </p>
  <p>
    My research focuses on low-level vision, particularly
    <strong>image signal processing (ISP) parameter optimization</strong>.
    I aim to develop automatic and adaptive tuning methods for
    ISP pipelines to improve image quality and support downstream
    vision tasks.
  </p>

